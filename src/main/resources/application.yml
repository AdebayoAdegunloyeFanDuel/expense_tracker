spring:
  application:
    name: expense-tracker
  
  # Database Configuration (H2 for dev, PostgreSQL for prod)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # Use 'update' for production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Security
  security:
    user:
      name: admin
      password: admin123

# JWT Configuration
jwt:
  secret: your-super-secret-key-change-this-in-production-minimum-32-chars-long!
  expiration: 86400000  # 24 hours in milliseconds

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Logging
logging:
  level:
    root: INFO
    com.accounting: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
